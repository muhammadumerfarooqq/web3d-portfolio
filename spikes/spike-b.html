<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Spike B | After Effects to MP4</title>
    <!-- Dev-only test page (P1 Test B). Not a vite.config.js input, so it never reaches the production build. -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0e1117;
        color: #f1f1f8;
        font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px 16px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 18px;
      }
      video {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
        background: #0e1117;
        border: 1px solid #2a2f3d;
        border-radius: 8px;
      }
      #info {
        margin: 10px 0 0;
        color: #b4b4c8;
      }
      #info.error {
        color: #ff8a80;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Spike B: After Effects → aerender → ffmpeg → MP4</h1>
      <video
        id="promo"
        src="/aftereffects/renders/spike-b.mp4"
        controls
        muted
        autoplay
        loop
        playsinline
        preload="metadata"
        aria-label="Test animation: name and title reveal"
      ></video>
      <p id="info" aria-live="polite">Loading video metadata…</p>
    </main>
    <script type="module">
      const video = document.getElementById('promo');
      const info = document.getElementById('info');

      video.addEventListener('loadedmetadata', () => {
        info.textContent = `Duration: ${video.duration.toFixed(2)} s · Resolution: ${video.videoWidth}×${video.videoHeight}`;
      });

      video.addEventListener('error', () => {
        const err = video.error;
        info.textContent = `Video error${err ? ` (code ${err.code})` : ''}: ${err?.message || 'could not load /aftereffects/renders/spike-b.mp4'}`;
        info.classList.add('error');
      });
    </script>
  </body>
</html>
